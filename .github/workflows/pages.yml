name: Publish to GitHub Pages
run-name: "Publish ${{ github.ref_name }} to GitHub Pages"

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - run: sed -i "s/__VERSION__/v${GITHUB_REF_NAME#v}/g" docs/assets/css/relayout.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v5
